[pytest]
testpaths = tests
filterwarnings =
    # Upstream Matplotlib 3.9.x internal calls to deprecated Pyparsing 3.3.x methods
    # Source: matplotlib/_fontconfig_pattern.py and matplotlib/_mathtext.py
    ignore::pyparsing.warnings.PyparsingDeprecationWarning
    # Starlette 1.7 deprecation notices for httpx/status code naming
    ignore::starlette.exceptions.StarletteDeprecationWarning
